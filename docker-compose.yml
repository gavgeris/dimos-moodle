services:
  mariadb:
    image: docker.io/bitnamilegacy/mariadb:latest
    container_name: moodle_db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-u", "bn_moodle",
              "-p${MARIADB_PASSWORD}", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_USER=bn_moodle
      - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - ./mariadb_data:/bitnami/mariadb
    ports:
      - 127.0.0.1:3306:3306
    networks:
      - moodle-network

  redis:
    image: redis
    container_name: moodle_redis
    restart: unless-stopped
    networks:
      - moodle-network

  moodle:
    build:
      context: .
      dockerfile: config/build/Dockerfile
    container_name: moodle
    restart: unless-stopped
    command: >
      bash -c "
        while ! php -r \"
          \$c = new mysqli('mariadb','bn_moodle',getenv('MOODLE_DATABASE_PASSWORD'),'bitnami_moodle');
          exit(\$c->connect_error ? 1 : 0);
        \" 2>/dev/null; do
          echo 'Waiting for DB...';
          sleep 5;
        done;
        echo 'DB ready, starting cron loop';
        while true; do
          php /var/www/html/admin/cli/cron.php;
          sleep 60;
        done"
    environment:
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DATABASE_PASSWORD}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT}
    volumes:
      # --- DATA (must persist) ---
      - ./moodledata_data:/var/www/moodledata
      - ./moodle_course_backups:/var/www/moodle_course_backups
      - ./config/moodle/config.php:/var/www/html/public/config.php:ro

      # --- PHP CONFIG (drop-in replacements for Bitnami mounts) ---
      - ./config/php-opcache/opcache-settings.ini:/usr/local/etc/php/conf.d/opcache-settings.ini:ro

      # --- PLUGINS (same as before, path changes /bitnami/moodle → /var/www/html) ---
      - ./plugins/mod/groupmembers:/var/www/html/public/mod/groupmembers
      - ./plugins/mod/questionnaire:/var/www/html/public/mod/questionnaire
      - ./plugins/mod/coursecertificate:/var/www/html/public/mod/coursecertificate
      - ./plugins/mod/attendance:/var/www/html/public/mod/attendance
      - ./plugins/mod/choicegroup:/var/www/html/public/mod/choicegroup
#      - ./plugins/mod/reengagement:/var/www/html/public/mod/reengagement
      - ./plugins/mod/zoom:/var/www/html/public/mod/zoom
      - ./plugins/blocks/sharing_cart:/var/www/html/public/blocks/sharing_cart
      - ./plugins/blocks/configurable_reports:/var/www/html/public/blocks/configurable_reports
      - ./plugins/blocks/completion_progress:/var/www/html/public/blocks/completion_progress
      - ./plugins/filter/filtercodes:/var/www/html/public/filter/filtercodes
      - ./plugins/filter/generico:/var/www/html/public/filter/generico
#      - ./plugins/filter/mb2shortcodes:/var/www/html/public/filter/mb2shortcodes
      - ./plugins/lib/editor/tiny/plugins/c4l:/var/www/html/public/lib/editor/tiny/plugins/c4l
      - ./plugins/auth/casattras:/var/www/html/public/auth/casattras
      - ./plugins/webservice/mcp:/var/www/html/public/webservice/mcp
      - ./plugins/admin/tool/certificate:/var/www/html/public/admin/tool/certificate
#      - ./plugins/admin/tool/log/store/lanalytics:/var/www/html/public/admin/tool/log/store/lanalytics
      - ./plugins/availability/condition/role:/var/www/html/public/availability/condition/role
      - ./plugins/availability/condition/percentage:/var/www/html/public/availability/condition/percentage
      - ./plugins/local/modcustomfields:/var/www/html/public/local/modcustomfields
      - ./plugins/local/staticpage:/var/www/html/public/local/staticpage
#      - ./plugins/local/mb2builder:/var/www/html/public/local/mb2builder
#      - ./plugins/local/mb2megamenu:/var/www/html/public/local/mb2megamenu
#      - ./plugins/local/mb2reviews:/var/www/html/public/local/mb2reviews
#      - ./plugins/local/mb2coursenotes:/var/www/html/public/local/mb2coursenotes
#      - ./plugins/local/learning_analytics:/var/www/html/public/local/learning_analytics
      - ./plugins/enrol/autoenrol:/var/www/html/public/enrol/autoenrol

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - moodle-network

  caddy:
    image: caddy:latest
    container_name: moodle_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy_data:/data
      - ./caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - moodle
    networks:
      - moodle-network
      - proxy-net

networks:
  moodle-network:
  proxy-net:
#    external: true