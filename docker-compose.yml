services:
  mariadb:
    image: docker.io/bitnamilegacy/mariadb:latest
    container_name: moodle_db
    restart: unless-stopped
    environment:
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_USER=bn_moodle
      - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - ./mariadb_data:/bitnami/mariadb
    ports:
      - 127.0.0.1:3306:3306
    networks:
      - moodle-network

  redis:
    image: redis
    container_name: moodle_redis
    restart: unless-stopped
    networks:
      - moodle-network

  moodle:
    build:
      context: .
      dockerfile: config/build/Dockerfile
    container_name: moodle
    restart: unless-stopped
    environment:
      - MOODLE_DATABASE_PASSWORD=${MARIADB_PASSWORD}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT}
    volumes:
      # --- DATA (must persist) ---
      - ./moodledata_data:/var/www/moodledata
      - ./moodle_course_backups:/var/www/moodle_course_backups

      # --- PHP CONFIG (drop-in replacements for Bitnami mounts) ---
      - ./config/php-opcache/opcache-settings.ini:/usr/local/etc/php/conf.d/opcache-settings.ini:ro

      # --- PLUGINS (same as before, path changes /bitnami/moodle → /var/www/html) ---
#      - ./plugins/mod/groupmembers:/var/www/html/mod/groupmembers
#      - ./plugins/mod/questionnaire:/var/www/html/mod/questionnaire
#      - ./plugins/mod/coursecertificate:/var/www/html/mod/coursecertificate
#      - ./plugins/mod/rocketchat:/var/www/html/mod/rocketchat
#      - ./plugins/mod/collabora:/var/www/html/mod/collabora
#      - ./plugins/mod/attendance:/var/www/html/mod/attendance
#      - ./plugins/mod/attendanceregister:/var/www/html/mod/attendanceregister
#      - ./plugins/mod/checklist:/var/www/html/mod/checklist
#      - ./plugins/mod/choicegroup:/var/www/html/mod/choicegroup
#      - ./plugins/mod/reengagement:/var/www/html/mod/reengagement
#      - ./plugins/mod/zoom:/var/www/html/mod/zoom
#      - ./plugins/blocks/sharing_cart:/var/www/html/blocks/sharing_cart
#      - ./plugins/blocks/configurable_reports:/var/www/html/blocks/configurable_reports
#      - ./plugins/blocks/completion_progress:/var/www/html/blocks/completion_progress
#      - ./plugins/filter/filtercodes:/var/www/html/filter/filtercodes
#      - ./plugins/filter/generico:/var/www/html/filter/generico
#      - ./plugins/filter/mb2shortcodes:/var/www/html/filter/mb2shortcodes
#      - ./plugins/lib/editor/tiny/plugins/c4l:/var/www/html/lib/editor/tiny/plugins/c4l
#      - ./plugins/auth/casattras:/var/www/html/auth/casattras
#      - ./plugins/webservice/mcp:/var/www/html/webservice/mcp
#      - ./plugins/admin/tool/certificate:/var/www/html/admin/tool/certificate
#      - ./plugins/admin/tool/log/store/lanalytics:/var/www/html/admin/tool/log/store/lanalytics
#      - ./plugins/availability/condition/role:/var/www/html/availability/condition/role
#      - ./plugins/availability/condition/percentage:/var/www/html/availability/condition/percentage
#      - ./plugins/local/modcustomfields:/var/www/html/local/modcustomfields
#      - ./plugins/local/staticpage:/var/www/html/local/staticpage
#      - ./plugins/local/mb2builder:/var/www/html/local/mb2builder
#      - ./plugins/local/mb2megamenu:/var/www/html/local/mb2megamenu
#      - ./plugins/local/mb2reviews:/var/www/html/local/mb2reviews
#      - ./plugins/local/mb2coursenotes:/var/www/html/local/mb2coursenotes
#      - ./plugins/local/padmap:/var/www/html/local/padmap
#      - ./plugins/local/oauth2:/var/www/html/local/oauth2
#      - ./plugins/local/learning_analytics:/var/www/html/local/learning_analytics
#      - ./plugins/enrol/autoenrol:/var/www/html/enrol/autoenrol

    depends_on:
      - mariadb
      - redis
    networks:
      - moodle-network

  caddy:
    image: caddy:latest
    container_name: moodle_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy_data:/data
      - ./caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - moodle
    networks:
      - moodle-network
      - proxy-net

networks:
  moodle-network:
  proxy-net:
    external: true